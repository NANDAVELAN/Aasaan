properties:
  environmentId: ${ENV_ID}
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8000
      allowInsecure: false
    registries:
      - server: ${ACR}.azurecr.io
        username: ${ACR}
        passwordSecretRef: acr-password
    secrets:
      - name: acr-password
        value: ${ACR_PW}
      - name: gemini-key
        value: ${GEMINI_API_KEY}
      - name: admin-token
        value: ${AASAAN_ADMIN_TOKEN}
      - name: sarvam-key
        value: ${SARVAM_API_KEY}
      - name: typesafe-key
        value: ${TYPESAFE_API_KEY}
      - name: youtube-key
        value: ${YOUTUBE_API_KEY}
      - name: firecrawl-key
        value: ${FIRECRAWL_API_KEY}
  template:
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes:
      - name: local
        storageType: EmptyDir
      - name: files
        storageType: AzureFile
        storageName: aasaanfiles
        mountOptions: uid=10001,gid=10001,file_mode=0660,dir_mode=0770
    initContainers:
      - name: restore
        image: ${ACR}.azurecr.io/aasaan:${TAG}
        command: ["python", "-m", "app.restore"]
        resources: { cpu: 0.25, memory: 0.5Gi }
        env:
          - { name: AASAAN_DB, value: /app/local/aasaan.db }
          - { name: AASAAN_BACKUP_DIR, value: /mnt/files/backups }
        volumeMounts:
          - { volumeName: local, mountPath: /app/local }
          - { volumeName: files, mountPath: /mnt/files }
    containers:
      - name: app
        image: ${ACR}.azurecr.io/aasaan:${TAG}
        resources: { cpu: 0.5, memory: 1Gi }
        env:
          - { name: AASAAN_DB, value: /app/local/aasaan.db }
          - { name: AASAAN_UPLOADS, value: /mnt/files/uploads }
          - { name: AASAAN_BACKUP_DIR, value: /mnt/files/backups }
          - { name: AASAAN_TRUSTED_PROXY_HOPS, value: "1" }
          - { name: AASAAN_CSP_MODE, value: "${AASAAN_CSP_MODE}" }
          - { name: AASAAN_DOMAIN, value: "${FQDN}" }
          - { name: AASAAN_CONTACT, value: "${AASAAN_CONTACT}" }
          - { name: AASAAN_NB_PER_HOUR, value: "12" }
          - { name: AASAAN_CHAPTER_CONCURRENCY, value: "2" }
          - { name: AASAAN_MAX_CALLS, value: "4" }
          - { name: GEMINI_API_KEY, secretRef: gemini-key }
          - { name: AASAAN_ADMIN_TOKEN, secretRef: admin-token }
          - { name: SARVAM_API_KEY, secretRef: sarvam-key }
          - { name: TYPESAFE_API_KEY, secretRef: typesafe-key }
          - { name: YOUTUBE_API_KEY, secretRef: youtube-key }
          - { name: FIRECRAWL_API_KEY, secretRef: firecrawl-key }
        volumeMounts:
          - { volumeName: local, mountPath: /app/local }
          - { volumeName: files, mountPath: /mnt/files }
        probes:
          - type: Startup
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          - type: Liveness
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
          - type: Readiness
            httpGet: { path: /health/ready, port: 8000 }
            periodSeconds: 10
      - name: backup
        image: ${ACR}.azurecr.io/aasaan:${TAG}
        command: ["python", "-m", "app.backup_loop"]
        resources: { cpu: 0.25, memory: 0.5Gi }
        env:
          - { name: AASAAN_DB, value: /app/local/aasaan.db }
          - { name: AASAAN_BACKUP_DIR, value: /mnt/files/backups }
          - { name: AASAAN_BACKUP_EVERY_MIN, value: "5" }
          - { name: AASAAN_BACKUP_KEEP_DAYS, value: "14" }
        volumeMounts:
          - { volumeName: local, mountPath: /app/local }
          - { volumeName: files, mountPath: /mnt/files }
